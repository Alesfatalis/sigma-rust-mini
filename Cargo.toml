[workspace]
resolver = "2"
members = [
    "sigma-test-util",
    "sigma-ser",
    "sigma-util",
    "ergotree-ir",
    "ergotree-interpreter",
    "ergo-lib",
    "ergo-chain-types",
    "gf2_192",
]

[workspace.package]
repository = "https://github.com/ergoplatform/sigma-rust"
edition = "2021"

[workspace.dependencies]
sigma-util = { version = "^0.14.0", path = "./sigma-util" }
sigma-ser = { version = "^0.15.0", path = "./sigma-ser", default-features = false }
ergotree-ir = { version = "^0.27.1", path = "./ergotree-ir", default-features = false}
ergo-chain-types = { version = "^0.14.1", path = "./ergo-chain-types", default-features = false}
sigma-test-util = { version = "^0.3.0", path = "./sigma-test-util" }
ergotree-interpreter = { version = "^0.27.1", path = "./ergotree-interpreter", default-features = false }
ergo-lib = { version = "^0.27.1", path = "./ergo-lib"}
k256 = { version = "0.13.1", default-features = false, features = ["arithmetic", "ecdsa"] }
elliptic-curve = { version = "0.13", features = ["ff"] }
thiserror = { version = "2.0.1", default-features = false }
bounded-vec = { version = "0.8.0", default-features = false }
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
derive_more = { version = "0.99", features = [
    "add",
    "add_assign",
    "mul",
    "not",
    "from",
    "into",
    "try_into",
    "from_str",
    "display",
] }
blake2 = { version = "0.10.6" , default-features = false }
sha2 = { version = "0.10", default-features = false }
num-derive = "0.4.2"
num-traits =  { version = "0.2.14", default-features = false }
num-bigint =  { version = "0.4.0", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
bs58 = { version = "0.4.0", default-features = false, features = ["alloc"] }
base16 = { version = "0.2.1", default-features = false, features = ["alloc"] }
base64 = { version = "0.13.0", default-features = false, features = ["alloc"] }
indexmap = { version = "2.6.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = [
    "arbitrary_precision",
] }
serde_with = { version = "3.11.0", default-features = false, features = ["json", "macros"] }
rand = "0.8.5"
url = "2.5.4"
miette = { version = "5", features = ["fancy"] }
hashbrown = { version = "0.14.3", features = ["serde"] }
core2 = { version = "0.4.0", default-features = false, features = ["alloc"] }

# dev-dependencies
proptest = { version = "1.5.0", default-features = false, features = ["std", "alloc"] }
proptest-derive = "0.3"
pretty_assertions = "1.3"
wasm-bindgen-test = "0.3.37"
expect-test = "1.4.1"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
